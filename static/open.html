<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Tickets · Pylon QC</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/shell.css">
<style>
  .controls {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    margin-bottom: 12px;
  }
  .controls label { font-size: 12px; color: var(--muted); }
  .controls input[type="date"] {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 5px 8px;
    font-size: 12px; font-family: inherit;
    color-scheme: dark;
  }
  .controls .all-time {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--muted); border-radius: 999px; padding: 5px 13px;
    font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .controls .all-time.active {
    background: color-mix(in srgb, var(--color-accent) 16%, transparent);
    border-color: var(--color-accent); color: var(--color-accent);
  }
  .run-side { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .run-side .hint { font-size: 11.5px; color: var(--muted); max-width: 380px; }
  .run-side label.refresh {
    display: flex; gap: 6px; align-items: center; font-size: 12px;
    color: var(--text); cursor: pointer; white-space: nowrap;
  }
  .run-side input[type="checkbox"] { accent-color: var(--color-accent); cursor: pointer; }
  #run-btn, #refetch-btn, #slack-report-btn {
    background: color-mix(in srgb, var(--color-accent) 16%, transparent);
    border: 1px solid var(--color-accent); color: var(--color-accent);
    border-radius: 8px; padding: 6px 16px; font-size: 12.5px;
    font-weight: 700; cursor: pointer; font-family: inherit;
  }
  #refetch-btn, #slack-report-btn {
    background: transparent; border-color: var(--border); color: var(--muted);
  }
  #refetch-btn:hover, #slack-report-btn:hover { border-color: var(--color-accent); color: var(--color-accent); }
  #run-btn:disabled, #refetch-btn:disabled, #slack-report-btn:disabled { opacity: .5; cursor: default; }

  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; align-items: center; }
  .pills .pill-label {
    font-size: 11px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .5px; margin-right: 4px;
  }
  .state-pill {
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); font-size: 11.5px; padding: 3px 11px;
    border-radius: 12px; cursor: pointer; font-family: inherit;
    transition: border-color .15s, color .15s, background .15s;
  }
  .state-pill:hover { border-color: var(--accent2); color: var(--accent2); }
  .state-pill.active {
    border-color: var(--color-accent); color: var(--color-accent);
    background: color-mix(in srgb, var(--color-accent) 16%, transparent);
  }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .assignee-ms { position: relative; display: inline-block; }
  .assignee-ms[hidden] { display: none; }  /* display rule above would beat the hidden attribute */
  .assignee-ms-btn {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--muted); font-size: 12px;
    padding: 4px 24px 4px 8px; cursor: pointer; white-space: nowrap;
    max-width: 190px; overflow: hidden; text-overflow: ellipsis;
    position: relative;
  }
  .assignee-ms-btn::after {
    content: "▾"; position: absolute; right: 7px; top: 50%;
    transform: translateY(-50%); font-size: 10px; color: var(--muted);
  }
  .assignee-ms-btn:hover, .assignee-ms-btn.open { border-color: var(--accent); color: var(--text); }
  .assignee-ms-dropdown {
    position: absolute; top: calc(100% + 4px); left: 0; min-width: 200px;
    max-height: 260px; overflow-y: auto; background: var(--surface2);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: 0 4px 16px rgba(0,0,0,.18); z-index: 200; display: none;
    padding: 4px 0;
  }
  .assignee-ms-dropdown.open { display: block; }
  .assignee-ms-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px;
    cursor: pointer; font-size: 12px; color: var(--text); user-select: none;
  }
  .assignee-ms-item:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
  .assignee-ms-item input { accent-color: var(--accent); cursor: pointer; }
  .assignee-ms-clear {
    display: block; width: 100%; text-align: left; padding: 6px 12px;
    background: none; border: none; color: var(--accent2); cursor: pointer;
    font: inherit; font-size: 12px;
  }
  /* The chips are the QC-result filter, not just counters: click one to see
     only those tickets, click it again (or the total) for everything. */
  .chip {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 16px; min-width: 96px;
    cursor: pointer; font-family: inherit; text-align: left;
    transition: border-color .15s, background .15s;
  }
  .chip:hover { border-color: var(--color-accent); }
  .chip.active {
    border-color: var(--color-accent);
    background: color-mix(in srgb, var(--color-accent) 12%, transparent);
  }
  .chip b { display: block; font-size: 20px; font-weight: 700; color: var(--text); }
  .chip span { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
  .chip.c-pass b   { color: var(--pass); }
  .chip.c-fail b   { color: var(--fail); }
  .chip.c-review b { color: var(--review); }

  .result-line {
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); padding: 10px 13px; font-size: 12.5px;
    color: var(--text); margin-bottom: 14px; display: none;
  }
  .result-line.err { border-color: var(--fail); }
  .result-line.show { display: block; }

  .table-wrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 760px; }
  th {
    text-align: left; padding: 9px 12px; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
    border-bottom: 1px solid var(--border); background: var(--surface2);
    white-space: nowrap;
  }
  td { padding: 9px 12px; border-bottom: 1px solid var(--border); color: var(--text); }
  tr:last-child td { border-bottom: 0; }
  td a { color: var(--accent2); text-decoration: none; }
  td a:hover { text-decoration: underline; }
  tbody tr[data-id] { cursor: pointer; transition: background .12s; }
  tbody tr[data-id]:hover { background: var(--surface2); }
  .grade { font-weight: 600; }
  .signed-by { font-size: 10.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
  .grade.Pass { color: var(--pass); }
  .grade.Fail { color: var(--fail); }
  .grade.NR   { color: var(--review); }
  .grade.pending { color: var(--muted); font-weight: 400; }
  .state-cell { text-transform: capitalize; white-space: nowrap; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 22px; text-align: center; font-size: 13px; }
</style>
</head>
<body class="shell" data-page="open">
<nav class="app-nav" id="app-nav"></nav>
<div class="app-main">
  <header class="app-header">
    <h1>Open Tickets</h1>
    <span class="muted">QC on everything not Closed or Archived — whatever day it was fetched.</span>
    <div class="spacer"></div>
  </header>
  <div class="app-body">
    <div class="content-pane">

      <div class="controls">
        <button class="all-time active" id="all-time">All time</button>
        <label>From <input type="date" id="start"></label>
        <label>To <input type="date" id="end"></label>
        <div class="run-side">
          <span class="hint" id="preview-hint"></span>
          <button id="slack-report-btn" hidden
                  title="Post this view's report to the Slack channel — fails and needs-review only, honouring the date and status filters">
            Send report to Slack</button>
          <button id="refetch-btn" hidden
                  title="Search Pylon for every open ticket — including ones never fetched on any day — and pull them in">
            Re-fetch open tickets</button>
          <label class="refresh" id="refresh-wrap" hidden>
            <input type="checkbox" id="refresh-cb" checked>
            Refresh from Pylon first
          </label>
          <button id="run-btn" hidden>Run QC</button>
        </div>
      </div>

      <div class="pills" id="pills" hidden>
        <span class="pill-label">Status</span>
      </div>

      <div class="assignee-ms" id="group-ms" style="margin-bottom:12px" hidden>
        <button class="assignee-ms-btn" id="group-ms-btn"
                title="Filter by review-coverage group (APAC, EMEA, …) — matches each ticket's assignee against the Admin rosters">All groups</button>
        <div class="assignee-ms-dropdown" id="group-ms-dropdown">
          <button class="assignee-ms-clear" id="group-ms-clear">All groups</button>
          <div id="group-ms-list"></div>
        </div>
      </div>

      <div class="result-line" id="result-line"></div>

      <div class="chips" id="chips"></div>

      <div class="table-wrap"><table>
        <thead><tr>
          <th>#</th><th>Title</th><th>Status</th><th>Assignee</th>
          <th>Fetched</th><th>QC</th><th>Last checked</th>
        </tr></thead>
        <tbody id="rows"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody>
      </table></div>

    </div>
  </div>
</div>

<script src="/static/shell.js"></script>
<script src="/static/review-sheet.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => QC.esc(s);

let selStates = new Set();   // lowercase status values; empty = all open
let gradeFilter = "";        // "" = all; "Pass" / "Fail" / "Needs Review" / "pending"
let coverages = [];          // review-coverage groups (APAC, EMEA, …) from Admin
const selectedGroups = new Set();   // coverage ids as strings, plus "ungrouped"
let lastTickets = [];        // the fetched list; the grade filter subsets it client-side
let lastSummary = { total: 0, pass: 0, fail: 0, review: 0, pending: 0 };
let loadToken = 0;
let running   = false;

function rangeQS() {
  const parts = [];
  const s = $("start").value, e = $("end").value;
  if (s) parts.push(`start=${s}`);
  if (e) parts.push(`end=${e}`);
  if (selStates.size) parts.push(`states=${encodeURIComponent([...selStates].join(","))}`);
  return parts.length ? "?" + parts.join("&") : "";
}

function stateLabel(s) {
  const t = (s || "—").replace(/_/g, " ");
  return t.charAt(0).toUpperCase() + t.slice(1);
}

function gradeCell(g) {
  if (!g) return `<span class="grade pending">pending</span>`;
  const cls = g === "Needs Review" ? "NR" : g;
  return `<span class="grade ${esc(cls)}">${esc(g)}</span>`;
}

function renderPills(counts) {
  const host = $("pills");
  host.querySelectorAll(".state-pill").forEach(el => el.remove());
  // The pill list comes from the range, not the state filter, so numbers hold
  // steady while pills are toggled.
  counts.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "state-pill" + (selStates.has(c.state) ? " active" : "");
    btn.textContent = `${stateLabel(c.state)} (${c.n})`;
    btn.dataset.state = c.state;
    btn.addEventListener("click", () => {
      if (selStates.has(c.state)) selStates.delete(c.state);
      else selStates.add(c.state);
      load();
    });
    host.appendChild(btn);
  });
  host.hidden = !counts.length;
}

function gradeOf(t) { return t.overall_result || "pending"; }

// The same group semantics as the dashboard: a ticket belongs to a group when
// its assignee is on that coverage roster; "ungrouped" catches everyone else.
function inSelectedGroups(t) {
  if (selectedGroups.size === 0) return true;
  const name = t.assignee_name || "Unassigned";
  const inAny = coverages.some(c => (c.assignees || []).includes(name));
  if (selectedGroups.has("ungrouped") && !inAny) return true;
  return coverages.some(c =>
    selectedGroups.has(String(c.id)) && (c.assignees || []).includes(name));
}

function groupScoped() {
  return selectedGroups.size ? lastTickets.filter(inSelectedGroups)
                             : lastTickets;
}

function visibleTickets() {
  const scoped = groupScoped();
  return gradeFilter ? scoped.filter(t => gradeOf(t) === gradeFilter) : scoped;
}

function renderChips() {
  let s = lastSummary;
  if (selectedGroups.size) {
    const rows = groupScoped();
    s = { total: rows.length,
          pass: rows.filter(t => gradeOf(t) === "Pass").length,
          fail: rows.filter(t => gradeOf(t) === "Fail").length,
          review: rows.filter(t => gradeOf(t) === "Needs Review").length,
          pending: rows.filter(t => gradeOf(t) === "pending").length };
  }
  const chip = (grade, n, label, cls = "") => `
    <button type="button" class="chip ${cls}${gradeFilter === grade ? " active" : ""}"
            data-grade="${esc(grade)}"
            title="${grade ? `Show only ${label} tickets` : "Show every open ticket"}">
      <b>${n}</b><span>${label}</span>
    </button>`;
  $("chips").innerHTML =
    chip("", s.total, "Open in scope")
    + chip("Pass", s.pass, "Pass", "c-pass")
    + chip("Fail", s.fail, "Fail", "c-fail")
    + chip("Needs Review", s.review, "Needs review", "c-review")
    + chip("pending", s.pending, "Pending QC");
}

function renderRows(tickets) {
  if (!tickets.length) {
    $("rows").innerHTML = `<tr><td colspan="7" class="empty">No open tickets match.</td></tr>`;
    return;
  }
  $("rows").innerHTML = tickets.map(t => {
    const num = t.link
      ? `<a href="${esc(t.link)}" target="_blank" rel="noopener noreferrer">#${esc(t.number ?? "—")}</a>`
      : `#${esc(t.number ?? "—")}`;
    return `<tr data-id="${esc(t.ticket_id)}" data-date="${esc(t.fetch_date || "")}"
                data-num="${esc(t.number ?? "")}" data-link="${esc(t.link || "")}"
                title="Open QC detail — frozen record, with Dashboard / Report Card / Pylon links">
      <td>${num}</td>
      <td>${esc(t.title || "(no title)")}</td>
      <td class="state-cell">${esc(stateLabel(t.state))}</td>
      <td>${esc(t.assignee_name)}</td>
      <td class="muted">${esc(t.fetch_date || "—")}</td>
      <td>${gradeCell(t.overall_result)}${t.signed_off_by
        ? `<div class="signed-by" title="Signed off by ${esc(t.signed_off_by)}${t.review_note ? ` — “${esc(t.review_note)}”` : ""}">✓ signed off · ${esc(t.signed_off_by)}${t.review_note ? " 💬" : ""}</div>` : ""}</td>
      <td class="muted">${t.checked_at ? esc(QC.fmtTime(t.checked_at)) : "—"}</td>
    </tr>`;
  }).join("");
}

async function load() {
  const token = ++loadToken;
  $("all-time").classList.toggle("active", !$("start").value && !$("end").value);
  $("chips").innerHTML = QC.skeleton.chips(5);
  $("rows").innerHTML = QC.skeleton.tableRows(7, 8);
  $("preview-hint").textContent = "";
  try {
    const [list, prev] = await Promise.all([
      QC.api(`/api/open/tickets${rangeQS()}`),
      QC.api(`/api/open/preview${rangeQS()}`),
    ]);
    if (token !== loadToken) return;   // a newer filter already landed
    lastTickets = list.tickets;
    lastSummary = list.summary;
    renderPills(list.state_counts);
    renderChips();
    renderRows(visibleTickets());
    const spent = prev.spend && prev.spend.runs
      ? ` Backlog runs so far: ${prev.spend.runs} (~$${Number(prev.spend.total_cost_usd).toFixed(4)}).`
      : "";
    $("preview-hint").textContent = prev.reason + spent;
  } catch (e) {
    if (token !== loadToken) return;
    $("rows").innerHTML = `<tr><td colspan="7" class="empty">${esc(e.message)}</td></tr>`;
  }
}

async function runQC() {
  if (running) return;
  running = true;
  const btn = $("run-btn");
  btn.disabled = true;
  btn.textContent = "Running…";
  const line = $("result-line");
  line.className = "result-line";
  try {
    const refresh = $("refresh-cb").checked ? 1 : 0;
    const qs = rangeQS();
    const url = `/api/open/qc${qs ? qs + "&" : "?"}refresh=${refresh}`;
    const r = await QC.api(url, { method: "POST" });
    const bits = [];
    if (r.refresh) {
      bits.push(`refreshed ${r.refresh.stored} of ${r.refresh.requested} from Pylon`);
      if (r.refresh.deleted) bits.push(`${r.refresh.deleted} gone at source`);
      if (r.refresh.failed) bits.push(`${r.refresh.failed} could not be refreshed`);
    }
    if (r.already_done) {
      bits.push("nothing needed scoring — every open ticket is already graded and unchanged");
    } else {
      bits.push(`scored ${r.scored}`);
      if (r.skipped) bits.push(`${r.skipped} skipped`);
      if (r.cost_usd != null) bits.push(`~$${Number(r.cost_usd).toFixed(4)}`);
      bits.push(`status: ${r.status}`);
    }
    line.textContent = "Run finished — " + bits.join(" · ") + ".";
    line.classList.add("show");
    if (r.status && r.status !== "success") line.classList.add("err");
  } catch (e) {
    line.textContent = e.message;
    line.className = "result-line err show";
  } finally {
    running = false;
    btn.disabled = false;
    btn.textContent = "Run QC";
    load();
  }
}

async function refetchOpen() {
  if (running) return;
  running = true;
  const btn = $("refetch-btn");
  btn.disabled = true;
  btn.textContent = "Re-fetching…";
  const line = $("result-line");
  line.className = "result-line";
  try {
    const r = await QC.api("/api/open/refetch", { method: "POST" });
    const bits = [
      `${r.found_open} open in Pylon`,
      `${r.new} new to the database`,
      `${r.stored} stored`,
    ];
    if (r.no_longer_open_checked) bits.push(`${r.no_longer_open_checked} no longer open — updated`);
    if (r.deleted) bits.push(`${r.deleted} gone at source`);
    if (!r.search_complete) bits.push("search was incomplete — some pages could not be read");
    line.textContent = "Re-fetch finished — " + bits.join(" · ") + ".";
    line.classList.add("show");
    if (!r.search_complete) line.classList.add("err");
  } catch (e) {
    line.textContent = e.message;
    line.className = "result-line err show";
  } finally {
    running = false;
    btn.disabled = false;
    btn.textContent = "Re-fetch open tickets";
    load();
  }
}

async function sendOpenReport() {
  if (running) return;
  running = true;
  const btn = $("slack-report-btn");
  btn.disabled = true;
  btn.textContent = "Sending…";
  const line = $("result-line");
  line.className = "result-line";
  try {
    // rangeQS carries exactly the filters the report honours: dates and
    // status pills. The QC-result chips are a view filter only — the report
    // always details Fail and Needs Review, like the scheduler.
    const r = await QC.api(`/api/open/report${rangeQS()}`, { method: "POST" });
    const replies = r.thread_replies || 0;
    let text = `Report sent to Slack — ${replies} detail repl${replies === 1 ? "y" : "ies"} in thread · mentions: ${r.mention_mode}`;
    if ((r.unresolved_names || []).length) {
      text += ` · no Slack id for ${r.unresolved_names.join(", ")}`;
    }
    line.textContent = text + ".";
    line.classList.add("show");
  } catch (e) {
    line.textContent = e.message;
    line.className = "result-line err show";
  } finally {
    running = false;
    btn.disabled = false;
    btn.textContent = "Send report to Slack";
  }
}

$("start").addEventListener("change", load);
$("end").addEventListener("change", load);
$("all-time").addEventListener("click", () => {
  $("start").value = "";
  $("end").value = "";
  load();
});
$("run-btn").addEventListener("click", runQC);
$("refetch-btn").addEventListener("click", refetchOpen);
$("slack-report-btn").addEventListener("click", sendOpenReport);

function updateGroupBtn() {
  const btn = $("group-ms-btn");
  if (selectedGroups.size === 0) btn.textContent = "All groups";
  else if (selectedGroups.size === 1) {
    const id = [...selectedGroups][0];
    const c = coverages.find(x => String(x.id) === id);
    btn.textContent = id === "ungrouped" ? "Ungrouped" : (c ? c.name : id);
  } else btn.textContent = `${selectedGroups.size} groups`;
}

function renderGroupFilter() {
  const ms = $("group-ms");
  if (!coverages.length) { ms.hidden = true; return; }
  ms.hidden = false;
  const list = $("group-ms-list");
  const rows = [...coverages.map(c => ({ id: String(c.id), name: c.name })),
                { id: "ungrouped", name: "Ungrouped" }];
  list.innerHTML = rows.map(g => `
    <label class="assignee-ms-item">
      <input type="checkbox" value="${esc(g.id)}"
             ${selectedGroups.has(g.id) ? "checked" : ""}>
      ${esc(g.name)}
    </label>`).join("");
  list.querySelectorAll("input").forEach(cb =>
    cb.addEventListener("change", () => {
      if (cb.checked) selectedGroups.add(cb.value);
      else selectedGroups.delete(cb.value);
      updateGroupBtn();
      renderChips();
      renderRows(visibleTickets());
    }));
  updateGroupBtn();
}

(function wireGroupFilter() {
  const btn = $("group-ms-btn"), drop = $("group-ms-dropdown");
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const open = drop.classList.toggle("open");
    btn.classList.toggle("open", open);
  });
  $("group-ms-clear").addEventListener("click", () => {
    selectedGroups.clear();
    renderGroupFilter();
    renderChips();
    renderRows(visibleTickets());
  });
  document.addEventListener("click", (e) => {
    if (!$("group-ms").contains(e.target)) {
      drop.classList.remove("open");
      btn.classList.remove("open");
    }
  });
  QC.ready.then(async () => {
    try {
      const d = await QC.api("/api/review/coverages");
      coverages = d.coverages || [];
      renderGroupFilter();
    } catch { /* no coverages: the picker simply stays hidden */ }
  });
})();

// QC-result filter: the chips are toggles, client-side over the loaded list.
$("chips").addEventListener("click", (ev) => {
  const chip = ev.target.closest(".chip[data-grade]");
  if (!chip) return;
  const grade = chip.dataset.grade;
  gradeFilter = (grade === gradeFilter) ? "" : grade;
  renderChips();
  renderRows(visibleTickets());
});

// A row opens the ticket's QC detail — the dashboard's slide-over, which
// already knows how to show which checks failed and why. The Pylon link in
// the first cell keeps its own meaning.
$("rows").addEventListener("click", (ev) => {
  if (ev.target.closest("a")) return;
  const tr = ev.target.closest("tr[data-id]");
  if (!tr || !tr.dataset.date) return;
  // The sheet opens IN PLACE, read-only: signing off stays the Report Card's
  // job, and the footer hands you Dashboard / Report Card / Pylon directly —
  // one hop to wherever you actually need to go, no chain of redirects.
  if (tr.dataset.num && window.QCReviewSheet) {
    QCReviewSheet.open({
      date: tr.dataset.date,
      number: tr.dataset.num,
      mode: "navigate",
      ticketId: tr.dataset.id,
      pylonLink: tr.dataset.link || "",
    });
    return;
  }
  location.href = `/?date=${encodeURIComponent(tr.dataset.date)}`
                + `&ticket=${encodeURIComponent(tr.dataset.id)}`;
});

// The natural loop here is: click a row → sign the ticket off on the
// dashboard sheet → press Back. A back/forward-cache restore replays the old
// DOM without re-fetching, so the sign-off that JUST happened was invisible
// until a manual reload. Re-fetch on restore; a normal load is unaffected.
window.addEventListener("pageshow", (ev) => {
  if (ev.persisted) load();
});

(async () => {
  await QC.ready;
  // The buttons that spend money follow the same role gate as the dashboard's.
  if (QC.me && QC.me.can_run_qc) {
    $("run-btn").hidden = false;
    $("refresh-wrap").hidden = false;
    $("refetch-btn").hidden = false;
    $("slack-report-btn").hidden = false;
  }
  await load();
})();
</script>
</body>
</html>
