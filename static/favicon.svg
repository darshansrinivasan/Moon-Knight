<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pylon QC">
  <title>Pylon QC</title>
  <!-- Nocturne ground, with the accent carried as a line rather than a fill —
       the system's own rule about where the accent is allowed to appear. -->
  <rect width="64" height="64" rx="14" fill="#161826"/>
  <!-- A checkmark: the app's one job is signing off support tickets. -->
  <path d="M17 33.5 L27 43.5 L47 21.5"
        fill="none" stroke="#9184d9" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
